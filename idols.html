<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>K-Saju × K-Pop · Find your idol match</title>
<meta property="og:title" content="Which K-pop idol is your Saju soulmate? 🇰🇷💜"/>
<meta property="og:description" content="Korean fortune-telling meets Saju to reveal which K-pop idol matches your birth chart. Free."/>
<style>
 :root{--gold:#e9c46a;--gold2:#f4d58d;--pink:#ff86c8;--muted:#9aa0c3}
 *{box-sizing:border-box}body{margin:0;font-family:Georgia,serif;color:#f3f1ff;min-height:100vh;
  background:radial-gradient(1100px 600px at 50% -8%,#3a2168 0%,transparent 58%),linear-gradient(180deg,#0d1023,#191040);
  display:flex;justify-content:center;padding:20px}
 .wrap{width:100%;max-width:440px}
 .card{background:linear-gradient(180deg,rgba(40,28,86,.92),rgba(18,16,46,.96));border:1px solid rgba(233,196,106,.32);
  border-radius:24px;padding:26px 22px;box-shadow:0 20px 60px rgba(0,0,0,.5);margin:10px 0}
 .han{font-size:12px;letter-spacing:6px;color:var(--gold);text-align:center;opacity:.85}
 h1{margin:6px 0;font-size:25px;text-align:center;line-height:1.25;
  background:linear-gradient(90deg,var(--gold),var(--pink),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
 .sub{color:#d7d3f5;font-size:14px;text-align:center;margin-bottom:18px}
 label{display:block;text-align:left;font-size:11px;color:var(--muted);margin:12px 2px 5px;letter-spacing:.5px}
 input,select{width:100%;padding:12px;border-radius:11px;border:1px solid rgba(233,196,106,.25);background:rgba(0,0,0,.25);color:#fff;font-size:15px;font-family:inherit}
 .row{display:flex;gap:10px}.row>div{flex:1}
 .btn{margin-top:14px;width:100%;padding:14px;border:none;border-radius:13px;cursor:pointer;font-size:15px;font-weight:bold;color:#241a00;background:linear-gradient(90deg,var(--gold),var(--pink));box-shadow:0 8px 24px rgba(255,134,200,.25)}
 .btn:active{transform:translateY(1px)}
 .or{text-align:center;color:var(--muted);font-size:12px;margin:14px 0 4px}
 .search{position:relative}
 .drop{position:absolute;left:0;right:0;top:100%;background:#1a1442;border:1px solid rgba(233,196,106,.3);border-radius:0 0 12px 12px;z-index:5;max-height:240px;overflow:auto}
 .drop div{padding:10px 12px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.05);font-size:14px}
 .drop div:hover{background:rgba(233,196,106,.12)}.drop .g{color:var(--muted);font-size:11px}
 .idol{display:flex;align-items:center;gap:12px;background:rgba(0,0,0,.25);border:1px solid rgba(233,196,106,.2);border-radius:14px;padding:12px;margin:9px 0;cursor:pointer}
 .idol:hover{border-color:var(--pink)}
 .idol .sc{font-size:22px;font-weight:bold;color:var(--gold2);min-width:54px;text-align:center}
 .idol .nm{font-size:16px;color:#fff}.idol .gr{font-size:12px;color:var(--muted)}.idol .ty{font-size:12px;color:var(--pink)}
 .result{text-align:center}
 .ring{font-size:46px;font-weight:bold;color:var(--gold2);margin:6px 0}
 .ty2{font-size:20px;color:var(--pink);margin:0}
 .rbody{text-align:left;line-height:1.6;font-size:15px;color:#e9e7ff;margin:16px 4px}
 .fact{text-align:left;font-size:12px;color:var(--muted);background:rgba(0,0,0,.2);border-radius:10px;padding:8px 10px;margin:4px 0}
 .cta{display:block;margin-top:16px;padding:14px;border-radius:13px;text-align:center;text-decoration:none;font-weight:bold;color:#241a00;background:linear-gradient(90deg,var(--gold),var(--gold2))}
 .ghost{background:transparent;border:1px solid rgba(255,255,255,.15);color:var(--muted)}
 .small{color:var(--muted);font-size:11px;text-align:center;margin-top:16px}
 .err{color:#ff9a9a;font-size:13px;text-align:center;margin-top:8px}
 .chips{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0 4px;flex-wrap:wrap}
 .chip{background:rgba(0,0,0,.28);border:1px solid rgba(233,196,106,.25);border-radius:12px;padding:8px 12px;font-size:12px;color:#e9e7ff;text-align:center}
 .chip b{display:block;color:var(--gold2);font-size:14px}
 .vs{color:var(--pink);font-weight:bold}
 .dim{text-align:left;margin:12px 2px}
 .dlab{display:flex;justify-content:space-between;font-size:13px;color:#e9e7ff;margin-bottom:5px}
 .dlab span{color:var(--gold2);font-weight:bold}
 .dbar{height:9px;background:rgba(0,0,0,.35);border-radius:6px;overflow:hidden}
 .dbar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--gold),var(--pink))}
 .dnote{font-size:11px;color:var(--muted);margin-top:4px;font-style:italic}
 .pc{text-align:left;border-radius:12px;padding:10px 12px;margin:8px 0;font-size:13px;line-height:1.5}
 .pull{background:rgba(120,220,150,.1);border:1px solid rgba(120,220,150,.3);color:#cdeedd}
 .caut{background:rgba(255,180,120,.08);border:1px solid rgba(255,180,120,.28);color:#f3ddc6}
 .notime{display:flex;align-items:center;font-size:12px;color:var(--muted)}
 .notime input{width:auto;margin-right:6px}
 .pair{display:flex;align-items:center;justify-content:center;gap:16px;margin:6px 0 2px}
 .ava{width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 30% 28%,var(--c,#5b3f9e),#160f38);
  border:2px solid var(--c,#7a5cc0);display:flex;align-items:center;justify-content:center;font-size:34px;color:#fff;
  background-size:cover;background-position:center top;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.4);flex:0 0 auto}
 .ava.sm{width:50px;height:50px;font-size:18px;border-width:1.5px}
 .ava span{text-shadow:0 1px 5px rgba(0,0,0,.7);font-weight:bold}
 .heart{font-size:30px;color:var(--pink);animation:beat 1.1s infinite}
 @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
 .pname{font-size:11px;color:var(--muted);margin-top:5px;max-width:96px;text-align:center;line-height:1.2}
 .realname{font-size:12px;color:var(--gold2);margin:8px 4px 2px;background:rgba(233,196,106,.08);border:1px solid rgba(233,196,106,.22);border-radius:10px;padding:7px 10px}
 .realname b{color:#fff}
</style></head><body><div class="wrap"><div class="card" id="card">
 <div id="form">
  <div class="han">韓 國 四 柱 × K-POP</div>
  <h1>Which K-pop idol is<br/>your Saju soulmate? 🇰🇷💜</h1>
  <div class="sub">1,300+ idols. Real Korean Four Pillars logic. Free.</div>
  <div class="row">
   <div><label>YOUR BIRTHDAY</label><input id="dob" type="date" value="2000-01-01"/></div>
   <div><label>MATCH ME WITH</label><select id="gpref"><option value="">Any idol</option><option value="F">Female</option><option value="M">Male</option></select></div>
  </div>
  <div class="row">
   <div><label>BIRTH TIME · TRUE SOLAR TIME (sharper)</label><input id="time" type="time" disabled/></div>
   <div><label>&nbsp;</label><label class="notime"><input type="checkbox" id="notime" checked onchange="document.getElementById('time').disabled=this.checked"/> I don't know my birth time</label></div>
  </div>
  <button class="btn" onclick="findBest()">💜 Find my idol match</button>
  <div class="or">— or check a specific bias —</div>
  <div class="search">
   <input id="q" placeholder="🔍 Type an idol or group… e.g. Jungkook, IVE" oninput="searchIdol()" autocomplete="off"/>
   <div class="drop" id="drop" style="display:none"></div>
  </div>
  <div id="err" class="err"></div>
  <div class="small">For fun only ✦ based on public birthdates ✦ not a real relationship prediction</div>
 </div>
 <div id="out"></div>
</div></div>
<script>
const $=(id)=>document.getElementById(id);
function birth(){const d=$('dob').value;if(!d){throw 0;}const [y,m,dd]=d.split('-');
 let h='',min='';if(!$('notime').checked&&$('time').value){const t=$('time').value.split(':');h=t[0];min=t[1];}
 return {y,m,d:dd,h,min};}
function bq(b){let q=`y=${b.y}&m=${b.m}&d=${b.d}`;if(b.h!==''){q+=`&h=${b.h}&min=${b.min}`;}return q;}
async function api(p){const r=await fetch(p);if(!r.ok)throw await r.json().catch(()=>({error:r.status}));return r.json();}
function show(html){$('form').style.display='none';$('out').innerHTML=html;scrollTo(0,0);}
function back(){$('form').style.display='block';$('out').innerHTML='';}

async function findBest(){
 $('err').textContent='';let b;try{b=birth();}catch{$('err').textContent='Enter your birthday first 🎂';return;}
 const g=$('gpref').value;
 $('out').innerHTML='<div class="sub">Reading 1,300+ charts…</div>';$('form').style.display='none';
 try{ const r=await api(`/api/best-idols?${bq(b)}`+(g?`&gender=${g}`:''));
  const cards=r.best.map(i=>`<div class="idol" onclick="openCompat(${i.id})">
     <div class="ava sm" id="ava${i.id}"><span>${esc((i.stage||'?')[0])}</span></div>
     <div style="flex:1"><div class="nm">${esc(i.stage)}</div><div class="gr">${esc(i.group||'soloist')}</div><div class="ty">${i.emoji} ${esc(i.type)}</div></div>
     <div class="sc">${i.score}%</div></div>`).join('');
  show(`<div class="han">作 緣</div><h1 style="font-size:22px">Your Top Idol Matches 💜</h1><div class="sub">Tap one for the full reading</div>${cards}<button class="btn ghost" onclick="back()">↺ Start over</button>`);
  r.best.forEach(i=>loadPhoto('ava'+i.id, i.stage, i.group));
 }catch(e){back();$('err').textContent=(e.error||'error');}
}
let tmr;
function searchIdol(){clearTimeout(tmr);const q=$('q').value.trim();const d=$('drop');if(q.length<2){d.style.display='none';return;}
 tmr=setTimeout(async()=>{try{const r=await api('/api/idols?q='+encodeURIComponent(q));
  if(!r.idols.length){d.style.display='none';return;}
  d.innerHTML=r.idols.map(i=>`<div onclick="pickIdol(${i.id},'${esc(i.stage).replace(/'/g,'')}')">${esc(i.stage)} <span class="g">${esc(i.group||'')}</span></div>`).join('');
  d.style.display='block';}catch{d.style.display='none';}},200);}
function pickIdol(id){$('drop').style.display='none';openCompat(id);}
async function openCompat(id){
 $('err').textContent='';let b;try{b=birth();}catch{$('err').textContent='Enter your birthday first 🎂';return;}
 $('form').style.display='none';$('out').innerHTML='<div class="sub">Reading your chemistry…</div>';
 try{ const r=await api(`/api/compat?${bq(b)}&idol=${id}`);
  const R=r.result, I=r.idol;
  const link=R.isMinor?'💛':'♡';
  const dims=R.dimensions.map(d=>`<div class="dim"><div class="dlab"><span style="color:#e9e7ff">${d.emoji} ${esc(d.label)}</span><span>${d.score}%</span></div><div class="dbar"><i style="width:${d.score}%"></i></div><div class="dnote">${esc(d.note)}</div></div>`).join('');
  show(`<div class="result"><div class="han">宮 合</div>
   <div class="pair">
    <div><div class="ava" id="meAva" style="--c:${col(R.you.element)}"><span>🙂</span></div><div class="pname">You<br/>${esc(R.you.element)}·${esc(R.you.animal)}</div></div>
    <div class="heart">${link}</div>
    <div><div class="ava" id="idolAva" style="--c:${col(R.them.element)}"><span>${esc((I.stage||'?')[0])}</span></div><div class="pname">${esc(I.stage)}<br/>${esc(R.them.element)}·${esc(R.them.animal)}</div></div>
   </div>
   <div class="ring">${R.score}%</div><p class="ty2">${R.emoji} ${esc(R.type)}</p>
   <div class="sub">${esc(I.group||'soloist')} · born ${esc(I.dob)}</div>
   ${(I.real||I.korean)?`<div class="realname">真 Saju reads the birth name: <b>${esc([I.korean,I.real].filter(Boolean).join(' · '))}</b></div>`:''}
   ${dims}
   <div class="rbody">${esc(R.body)}</div>
   <div class="pc pull">💚 <b>What pulls you together:</b> ${esc(R.pull)}</div>
   <div class="pc caut">⚠️ <b>What to watch:</b> ${esc(R.caution)}</div>
   ${R.factors.map(f=>`<div class="fact">✦ ${esc(f)}</div>`).join('')}
   <a class="cta" href="/app.html">✨ Get your Korean name + full Saju reading →</a>
   <button class="btn ghost" onclick="back()" style="margin-top:10px">↺ Try another idol</button>
   <div class="small">For fun only ✦ based on public birthdates ✦ not a real relationship prediction. Idol photo via Wikipedia.</div></div>`);
  loadPhoto('idolAva', I.stage, I.group);
 }catch(e){back();$('err').textContent=(e.error||'error');}
}
const ELEMCOL={Wood:'#6abf69',Fire:'#ff6b6b',Earth:'#d9a441',Metal:'#cfd8e3',Water:'#5aa9e6'};
function col(e){return ELEMCOL[e]||'#7a5cc0';}
const _photoCache={};
async function wikiPhoto(name,group){
 const key=name+'|'+(group||'');
 if(key in _photoCache) return _photoCache[key];
 const tryUrl=async(search)=>{
  try{const u=`https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrlimit=1&gsrsearch=${encodeURIComponent(search)}&prop=pageimages&piprop=thumbnail&pithumbsize=400`;
   const r=await fetch(u);const j=await r.json();const p=j.query&&j.query.pages?Object.values(j.query.pages)[0]:null;
   return p&&p.thumbnail?p.thumbnail.source:null;}catch{return null;}};
 let url=await tryUrl(`${name} ${group||''} singer kpop`.trim());
 if(!url&&group) url=await tryUrl(`${name} ${group}`);
 _photoCache[key]=url; return url;
}
async function loadPhoto(id,name,group){
 try{const el=$(id); if(!el)return; const url=await wikiPhoto(name,group);
  const el2=$(id); if(url&&el2){el2.style.backgroundImage=`url("${url}")`;el2.innerHTML='';}}catch{}
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
</script></body></html>
