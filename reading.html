<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>K-SAJU · Your Reading (사주)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Inter:wght@400;500;600&family=Nanum+Myeongjo:wght@700;800&display=swap" rel="stylesheet">
<style>
 :root{--paper:#cbc6b8;--bone:#e7e3da;--bone2:#efece4;--ink:#17140f;--graphite:#5c574d;--vellum:#bbb4a2;
  --seal:#c0392b;--wood:#2f6b54;--fire:#c0392b;--earth:#bf9430;--metal:#7c776b;--water:#222a36;--ease:cubic-bezier(.2,.7,.2,1);}
 *{box-sizing:border-box}html{scroll-behavior:smooth}
 body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif;
  display:flex;justify-content:center;min-height:100vh;-webkit-font-smoothing:antialiased}
 .wrap{width:100%;max-width:460px;min-height:100vh}
 .band{display:flex;height:5px}.band i{flex:1}
 .band i:nth-child(1){background:var(--wood)}.band i:nth-child(2){background:var(--fire)}
 .band i:nth-child(3){background:var(--earth)}.band i:nth-child(4){background:var(--metal)}.band i:nth-child(5){background:var(--water)}
 header{display:flex;justify-content:space-between;align-items:baseline;padding:16px 20px 0}
 .wm{font-family:Archivo,sans-serif;font-weight:900;letter-spacing:-.5px;font-size:15px}
 .wm small{font-family:"Nanum Myeongjo",serif;font-weight:800;color:var(--seal);margin-left:6px;font-size:12px}
 .tag{font-family:"Nanum Myeongjo",serif;font-size:12px;color:var(--graphite)}
 main{padding:20px}
 h1{font-family:Archivo,sans-serif;font-weight:900;letter-spacing:-1px;line-height:1;font-size:32px;margin:8px 0 2px;text-align:center}
 .kname{font-family:"Nanum Myeongjo",serif;font-weight:800;font-size:40px;text-align:center;margin:6px 0 2px}
 .sub{color:var(--graphite);font-size:13px;text-align:center;line-height:1.5}
 .pillars{display:flex;gap:8px;margin:18px 0}
 .gz{flex:1;background:var(--bone);border:1px solid var(--vellum);border-radius:8px;padding:11px 4px;text-align:center}
 .gz .k{font-family:"Nanum Myeongjo",serif;font-weight:800;font-size:20px}
 .gz .l{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--graphite);margin-top:4px;font-family:Archivo}
 .sec{margin:16px 0;padding-bottom:14px;border-bottom:1px solid var(--vellum)}
 .sec .h{font-family:Archivo,sans-serif;font-weight:900;font-size:17px}
 .sec .h .ko{font-family:"Nanum Myeongjo",serif;color:var(--seal);font-size:14px;margin-right:6px}
 .sec .v{color:var(--graphite);font-style:italic;font-size:13px;margin:3px 0 7px}
 .sec p{margin:0;line-height:1.7;font-size:15px;color:#2a2620}.sec b{color:var(--seal)}
 .mod{display:flex;align-items:center;gap:13px;background:var(--bone);border:1px solid var(--vellum);border-radius:9px;padding:13px;margin:10px 0}
 .mod .em{font-size:24px}.mod .t{flex:1;min-width:0}
 .mod .tt{font-family:Archivo,sans-serif;font-weight:700;font-size:15px}.mod .te{color:var(--graphite);font-size:11.5px;margin-top:2px;line-height:1.4}
 .open{background:var(--ink);color:var(--paper);border:none;border-radius:30px;padding:9px 16px;font-family:Archivo;font-weight:700;cursor:pointer;font-size:12px;white-space:nowrap}
 .lock{background:var(--seal);color:#fff;border:none;border-radius:30px;padding:9px 14px;font-family:Archivo;font-weight:700;cursor:pointer;font-size:12px;white-space:nowrap}
 .nameopt{display:flex;align-items:center;gap:13px;background:var(--bone);border:1px solid var(--vellum);border-radius:9px;padding:13px;margin:10px 0;cursor:pointer;transition:border-color .18s,transform .18s var(--ease)}
 .nameopt:hover{transform:translateY(-2px)}.nameopt.sel{border-color:var(--seal);background:var(--bone2)}
 .nameopt .kr{font-family:"Nanum Myeongjo",serif;font-weight:800;font-size:26px;min-width:54px;text-align:center}
 .nameopt .ro{font-family:Archivo,sans-serif;font-weight:700;font-size:14px}.nameopt .mn{color:var(--graphite);font-size:12px;margin-top:2px}
 .badge{font-size:10px;color:#fff;background:var(--wood);border-radius:5px;padding:1px 6px;margin-left:4px;font-family:Archivo}
 .listen{background:var(--bone2);border:1px solid var(--vellum);color:var(--ink);border-radius:50%;width:40px;height:40px;font-size:16px;cursor:pointer}
 .btn{width:100%;padding:14px;border:none;border-radius:30px;cursor:pointer;font-family:Archivo,sans-serif;font-weight:700;font-size:14px;
  background:var(--ink);color:var(--paper);margin-top:14px;transition:transform .18s var(--ease),box-shadow .18s}
 .btn:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(23,20,15,.22)}
 .btn.alt{background:transparent;color:var(--ink);border:1px solid var(--ink)}
 .btn.share{background:var(--seal);color:#fff}.btn.share:hover{box-shadow:0 10px 26px rgba(192,57,43,.3)}
 .btn[disabled]{opacity:.45;cursor:default;transform:none;box-shadow:none}
 .back{background:transparent;border:1px solid var(--vellum);color:var(--graphite);border-radius:30px;padding:8px 14px;cursor:pointer;font-size:12px;font-family:Archivo;font-weight:700}
 .file{margin:14px 0;width:100%;font-size:13px;color:var(--ink)}
 .small{color:var(--graphite);font-size:11px;text-align:center;margin-top:16px;line-height:1.5}
 .err{color:var(--seal);font-size:13px;text-align:center;margin-top:8px}
 .share-cap{text-align:center;font-size:11px;color:var(--graphite);margin:4px 0}
 .share-tools{display:flex;justify-content:center;gap:10px;margin:6px 0;flex-wrap:wrap}
 .share-tools button{width:44px;height:44px;border-radius:50%;border:1px solid var(--vellum);background:var(--bone2);color:var(--ink);
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-family:Archivo;font-weight:900;font-size:13px;transition:transform .16s var(--ease),background .16s,border-color .16s}
 .share-tools button:hover{transform:translateY(-2px);background:var(--bone);border-color:var(--ink)}
 #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);z-index:20;background:var(--ink);color:var(--paper);
  font-size:13px;font-weight:600;padding:11px 18px;border-radius:30px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s var(--ease)}
 #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style></head><body>
<div class="wrap"><div class="band"><i></i><i></i><i></i><i></i><i></i></div>
<header><div class="wm">K-SAJU<small>사주 (Saju)</small></div><div class="tag">운세</div></header>
<main><div id="card"><div class="sub">Reading your stars…</div></div></main></div>
<script>
const ID=location.pathname.split('/')[2];
let D=null, APPSHARE=null;
const card=document.getElementById('card');
const KOCH={overview:'개요',personality:'성격',wealth:'재물운',love:'연애·결혼운',career:'직업운',year2026:'2026 운세',luck:'행운의 열쇠'};
async function api(p,opt){const r=await fetch(p,opt);if(!r.ok)throw await r.json().catch(()=>({error:r.status}));return r.json();}
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){alert('🔊 '+t);}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function gz(k,l){return '<div class="gz"><div class="k">'+esc(k||'—')+'</div><div class="l">'+l+'</div></div>';}
function secHTML(s,key){const ko=KOCH[key]||'';return '<div class="sec"><div class="h">'+(ko?'<span class="ko">'+ko+'</span>':'')+esc(s.title)+'</div>'+(s.verdict?'<div class="v">“'+esc(s.verdict)+'”</div>':'')+'<p>'+s.body+'</p></div>';}
function toast(msg){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t);}t.textContent=msg;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2200);}

async function load(){
 try{ D=await api('/api/reading/'+ID); }catch(e){ card.innerHTML='<h1>Reading not found</h1><div class="sub">This link may be invalid or unpaid.</div>'; return; }
 if(D.needName){ renderNames(); return; }
 renderDash();
 const open=new URLSearchParams(location.search).get('open'); if(open) openModule(open);
}
function renderNames(){
 card.innerHTML='<h1>Choose your <span style="color:var(--seal)">Korean name</span></h1><div class="sub">Each chosen for your 사주 (Saju) · 🔊 tap to hear it</div><div id="nl" style="margin-top:14px"></div><button class="btn" id="go" disabled>Choose a name to continue</button>';
 const nl=document.getElementById('nl'); let chosen=null;
 D.names.forEach((n,i)=>{const d=document.createElement('div');d.className='nameopt';d.id='n'+i;
  d.innerHTML='<div class="kr">'+esc(n.kr)+'</div><div style="flex:1"><div class="ro">'+esc(n.ro)+' · '+esc(n.hanja)+(n.restoresMissing?'<span class="badge">restores '+esc(n.elemName)+'</span>':'')+'</div><div class="mn">'+esc(n.meaning)+'</div></div>';
  const b=document.createElement('button');b.className='listen';b.textContent='🔊';b.onclick=(e)=>{e.stopPropagation();speak(n.kr);};
  d.onclick=()=>{chosen=i;D.names.forEach((_,k)=>document.getElementById('n'+k).classList.toggle('sel',k===i));const g=document.getElementById('go');g.disabled=false;g.textContent='Continue as '+n.kr+' →';};
  d.appendChild(b);nl.appendChild(d);});
 document.getElementById('go').onclick=async()=>{ if(chosen==null)return; await api('/api/reading/'+ID+'/name',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({kr:D.names[chosen].kr})}); await load(); };
}
function renderDash(){
 const P=D.pillars; APPSHARE={kr:D.koreanName||D.name};
 let html='<div class="sub" style="font-family:Archivo;font-weight:700;letter-spacing:2px;text-transform:uppercase;font-size:10px;color:var(--graphite)">Your Saju · 사주팔자</div>'+
  '<div class="kname">'+esc(D.koreanName||D.name)+'</div>'+
  '<div class="sub">'+esc(D.dayMaster.en)+' Day Master · '+esc(D.zodiac.animal)+' '+D.zodiac.emoji+' · '+esc(D.strength)+' chart</div>'+
  '<div class="pillars">'+gz(P.yearKR,'Year')+gz(P.monthKR,'Month')+gz(P.dayKR,'Day')+gz(P.hourKR,'Hour')+'</div>'+
  '<div id="viewer"></div><div id="grid"></div>'+
  '<button class="btn share" onclick="shareResult()">📸 Share my Korean name</button>'+
  '<div class="share-cap">or send the link →</div>'+shareButtonsHtml()+
  '<div class="small">🔖 Bookmark this page — your reading lives here forever.'+(D.enrichEnabled?'':' ')+'</div>';
 card.innerHTML=html;
 const grid=document.getElementById('grid');
 D.modules.forEach(m=>{const d=document.createElement('div');d.className='mod';
  d.innerHTML='<div class="em">'+m.emoji+'</div><div class="t"><div class="tt">'+esc(m.title)+'</div><div class="te">'+esc(m.teaser)+'</div></div>';
  const btn=document.createElement('button');
  if(m.unlocked){btn.className='open';btn.textContent='Open';btn.onclick=()=>openModule(m.id);}
  else{btn.className='lock';btn.textContent='Unlock $'+m.price;btn.onclick=()=>unlock(m.id);}
  d.appendChild(btn);grid.appendChild(d);});
}
function renderModule(c){
 const v=document.getElementById('viewer');
 v.innerHTML='<button class="back" onclick="document.getElementById(\'viewer\').innerHTML=\'\'">↺ close</button><h1 style="font-size:20px;margin-top:10px">'+esc(c.title)+'</h1>'+(c.intro?'<div class="sub">'+esc(c.intro)+'</div>':'')+c.sections.map(s=>secHTML(s)).join('');
 v.scrollIntoView({behavior:'smooth'});
}
async function openModule(mod){
 const v=document.getElementById('viewer'); if(!v)return; v.innerHTML='<div class="sub">Reading the stars…</div>';
 try{ const r=await api('/api/reading/'+ID+'/module/'+mod);
  if(r.needsPhoto){ renderUpload(mod); return; }
  if(r.pending){ v.innerHTML='<div class="sub">✨ Preparing your reading… (a few seconds)</div>'; setTimeout(()=>pollModule(mod,0),2500); return; }
  renderModule(r.content);
 }catch(e){ v.innerHTML='<div class="sub">Locked. '+esc(e.error||'')+'</div>'; }
}
async function pollModule(mod,n){
 try{ const r=await api('/api/reading/'+ID+'/module/'+mod);
  if(r.content){ renderModule(r.content); return; }
  if(n<20) setTimeout(()=>pollModule(mod,n+1),2500);
  else document.getElementById('viewer').innerHTML='<div class="sub">Still preparing — reopen in a moment.</div>';
 }catch(e){ document.getElementById('viewer').innerHTML='<div class="sub">'+esc(e.error||'error')+'</div>'; }
}
function renderUpload(mod){
 const v=document.getElementById('viewer');
 v.innerHTML='<button class="back" onclick="document.getElementById(\'viewer\').innerHTML=\'\'">↺ close</button><h1 style="font-size:20px;margin-top:10px">✋ Palm Reading (손금)</h1><div class="sub">Upload a clear photo of your open <b>left palm</b> in good light.</div><input id="palmfile" type="file" accept="image/*" class="file"/><button class="btn" id="palmgo">Read my palm</button><div id="palmstat" class="small"></div>';
 document.getElementById('palmgo').onclick=async()=>{
  const f=document.getElementById('palmfile').files[0]; const st=document.getElementById('palmstat'); if(!f)return;
  if(f.size>5000000){ st.textContent='Image too large (max 5MB).'; return; }
  st.textContent='✨ Reading your palm…';
  const b64=await new Promise(res=>{const rd=new FileReader();rd.onload=()=>res(String(rd.result).split(',')[1]);rd.readAsDataURL(f);});
  try{ const r=await api('/api/reading/'+ID+'/palm',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({image:b64,mime:f.type})}); renderModule(r.content); }
  catch(e){ st.textContent=(e.error||'Could not read photo.'); }
 };
}
async function unlock(mod){
 const r=await api('/api/checkout',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({module:mod,readingId:ID})});
 location.href=r.url;
}
// ── share (Korean name card) ──
function shareUrl(){return location.origin+'/r/'+ID;}
function shareTextApp(){return APPSHARE?`My Korean name is ${APPSHARE.kr} ✦ Get your own Korean Saju (사주) name & reading:`:'';}
function platformShare(kind){
 const url=shareUrl(),text=shareTextApp(),eU=encodeURIComponent(url),eT=encodeURIComponent(text);
 if(kind==='copy'){ navigator.clipboard.writeText(text+' '+url).then(()=>{toast('Copied! Paste it anywhere ✦');const b=document.querySelector('.share-copy');if(b){b.classList.add('copied');setTimeout(()=>b.classList.remove('copied'),900);}}).catch(()=>prompt('Copy:',text+' '+url)); return; }
 const map={x:`https://twitter.com/intent/tweet?text=${eT}&url=${eU}`,whatsapp:`https://wa.me/?text=${encodeURIComponent(text+' '+url)}`,reddit:`https://www.reddit.com/submit?url=${eU}&title=${eT}`,telegram:`https://t.me/share/url?url=${eU}&text=${eT}`};
 window.open(map[kind],'_blank','noopener,noreferrer');
}
function shareButtonsHtml(){return `<div class="share-tools"><button onclick="platformShare('x')">X</button><button onclick="platformShare('whatsapp')">WA</button><button onclick="platformShare('reddit')">R</button><button onclick="platformShare('telegram')">TG</button><button class="share-copy" onclick="platformShare('copy')">🔗</button></div>`;}
async function waitForCardFonts(){ if(!document.fonts)return; await Promise.race([Promise.all([document.fonts.load('900 72px Archivo'),document.fonts.load('800 120px "Nanum Myeongjo"'),document.fonts.ready]),new Promise(r=>setTimeout(r,1800))]); }
function canvasToBlob(c){return new Promise((res,rej)=>{try{c.toBlob(b=>b?res(b):rej(new Error('x')),'image/png',0.95);}catch(e){rej(e);}});}
async function renderNameCard(){
 await waitForCardFonts();
 const W=1080,H=1920,kr=APPSHARE.kr,canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;const ctx=canvas.getContext('2d');
 ctx.fillStyle='#cbc6b8';ctx.fillRect(0,0,W,H);
 ctx.globalAlpha=.14;ctx.fillStyle='#17140f';for(let i=0;i<800;i++){ctx.fillRect(Math.random()*W,Math.random()*H,Math.random()*2.2,Math.random()*2.2);}ctx.globalAlpha=1;
 ['#2f6b54','#c0392b','#bf9430','#7c776b','#222a36'].forEach((c,i)=>{ctx.fillStyle=c;ctx.fillRect(i*(W/5),0,W/5,34);});
 ctx.textAlign='center';ctx.textBaseline='alphabetic';
 ctx.fillStyle='#17140f';ctx.font='900 56px Archivo,sans-serif';ctx.fillText('K-SAJU',W/2,150);
 ctx.fillStyle='#c0392b';ctx.font='800 38px "Nanum Myeongjo",serif';ctx.fillText('사주 · my Korean name',W/2,210);
 ctx.fillStyle='#17140f';ctx.font='800 300px "Nanum Myeongjo",serif';ctx.fillText(kr,W/2,840);
 ctx.strokeStyle='#7c776b';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(260,1010);ctx.lineTo(820,1010);ctx.stroke();
 ctx.fillStyle='#2a2620';ctx.font='500 42px Inter,sans-serif';ctx.fillText('Chosen for my Saju (사주) — Four Pillars.',W/2,1110);
 ctx.fillStyle='#17140f';ctx.font='900 44px Archivo,sans-serif';ctx.fillText('Get your Korean name',W/2,1700);
 ctx.fillStyle='#c0392b';ctx.font='900 40px Archivo,sans-serif';ctx.fillText('k-saju-wxe6.onrender.com',W/2,1772);
 return canvas;
}
async function shareResult(){
 if(!APPSHARE)return; let blob=null;
 try{ blob=await canvasToBlob(await renderNameCard()); }catch{ blob=null; }
 if(blob){ const file=new File([blob],`k-saju-name.png`,{type:'image/png'});
  try{ if(navigator.canShare&&navigator.canShare({files:[file]})&&navigator.share){ await navigator.share({title:'K-Saju',text:shareTextApp(),files:[file]}); return; } }
  catch(e){ if(e&&e.name==='AbortError')return; }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);toast('Image saved — post it anywhere ✦');return;
 }
 try{ if(navigator.share){ await navigator.share({title:'K-Saju',text:shareTextApp(),url:shareUrl()}); return; } }catch(e){ if(e&&e.name==='AbortError')return; }
 platformShare('copy');
}
load();
</script></body></html>
